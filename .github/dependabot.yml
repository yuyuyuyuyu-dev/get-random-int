version: 2

updates:
  - package-ecosystem: gradle
    # Every version is declared in the root version catalog, so no other directory holds
    # a version that Dependabot could bump.
    directory: /
    schedule:
      interval: daily
    # A pull request only merges once it carries the latest main, so a second open
    # one would always have to be rebased after the first one lands.
    open-pull-requests-limit: 1
    groups:
      # Compose Multiplatform names a minimum Kotlin version for the Wasm target, so a
      # pull request that moves one without the other can fail to build. Minor and patch
      # bumps would already share the group below, so what this group adds is the day one
      # of these is a major bump and the rest are not. It comes first because a dependency
      # joins the first group it matches.
      kotlin:
        patterns:
          - org.jetbrains.kotlin*
          - org.jetbrains.compose*
        # org.jetbrains.kotlinx matches the pattern above by prefix, but coroutines
        # follow a release line of their own.
        exclude-patterns:
          - org.jetbrains.kotlinx*
      # Minor and patch bumps are merged automatically, so batching them costs no review
      # time. Major bumps stay out so that each one is opened and read on its own.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
