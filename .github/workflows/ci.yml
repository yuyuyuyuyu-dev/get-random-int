name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  oxfmt:
    name: Oxfmt
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/oxfmt.yml@main
  kotlin-lint:
    name: Kotlin lint
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/kotlin-lint.yml@main
    with:
      compose-multiplatform: true
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run actionlint
        uses: raven-actions/actionlint@v2
  yamlfmt:
    name: yamlfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run yamlfmt
        uses: docker://ghcr.io/google/yamlfmt:0.21.0
        with:
          args: -lint .
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up the JDK and Gradle
        uses: yuyuyuyuyu-dev/repo-config/.github/actions/setup-jdk-and-gradle@main
        with:
          compose-multiplatform: true
      - name: Run tests
        run: ./gradlew allTests
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up the JDK and Gradle
        uses: yuyuyuyuyu-dev/repo-config/.github/actions/setup-jdk-and-gradle@main
        with:
          compose-multiplatform: true
      - name: Build
        run: ./gradlew :composeApp:wasmJsBrowserDistribution
